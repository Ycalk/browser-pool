[tool.poetry]
name = "browser-pool"
version = "0.1.0"
description = ""
authors = ["ycalk (Лосев Алексей) <alosev752@gmail.com>"]
packages = [
    {include = "browserpool/logging",from = "components"},
    {include = "browserpool/container_driver",from = "components"},
    {include = "browserpool/domain_core",from = "components"},
    {include = "browserpool/camoufox_server",from = "bases"},
    {include = "browserpool/migrator",from = "bases"},
    {include = "browserpool/variant",from = "components"},
    {include = "browserpool/service",from = "components"},
    {include = "browserpool/database",from = "components"},
    {include = "browserpool/entrypoint",from = "bases"},
]
[tool.poetry.dependencies]
python = ">=3.13,<3.15"
fastapi = {extras = ["standart"], version = "^0.146.0"}
dishka = {extras = ["fastapi"], version = "^1.10.1"}
pydantic-settings = "^2.16.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.1.5"}
aiosqlite = "^0.22.1"
structlog = "^26.1.0"
opentelemetry-api = "^1.45.1"
opentelemetry-sdk = "^1.45.1"
opentelemetry-exporter-otlp = "^1.45.1"
opentelemetry-instrumentation-fastapi = "^0.66b1"
opentelemetry-instrumentation-httpx = "^0.66b1"
opentelemetry-instrumentation-sqlalchemy = "^0.66b1"
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
httpx = "^0.28.1"
camoufox = {extras = ["geoip"], version = "^0.5.8"}
alembic = "^1.20.0"
uvicorn = "^0.54.0"
websockets = "^17.4"

[tool.basedpyright]
typeCheckingMode = "recommended"
extraPaths = ["components", "bases"]
reportUntypedFunctionDecorator = false
reportMissingTypeStubs = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportExplicitAny = false
reportImportCycles = false
reportCallInDefaultInitializer = false
reportIgnoreCommentWithoutRule = false
reportUnknownVariableType = false
reportUnusedCallResult = false
reportAny = false
enableTypeIgnoreComments = true
reportUnnecessaryTypeIgnoreComment = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "function"
testpaths = ["test"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start_container = "development.start_container:run"
start_browser = "development.start_browser:run"
alembic = "browserpool.migrator:run"
entrypoint = "browserpool.entrypoint:run"