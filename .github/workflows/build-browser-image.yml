name: build-browser-image

on:
  push:
    tags:
      - 'browser-*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#browser-}"
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag '$GITHUB_REF_NAME' does not match the browser-X.Y.Z pattern." >&2
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          IMAGE_NAME="$(echo "${{ github.repository }}/browser" | tr '[:upper:]' '[:lower:]')"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.version.outputs.image_name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=browser
            org.opencontainers.image.description=Chromium + KasmVNC browser image

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: projects/browser
          file: projects/browser/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEBIAN_TAG=bookworm-20260824-slim
            CHROMIUM_VERSION=152.0.7977.64-1
            KASMVNC_VERSION=1.5.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "The image has been published: \`${{ env.REGISTRY }}/${{ steps.version.outputs.image_name }}:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"