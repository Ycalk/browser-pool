[tool.poetry]
name = "camoufox_browser"
version = "0.1.0"

authors = ["ycalk (Лосев Алексей) <alosev752@gmail.com>"]
license = ""

packages = [
    {include = "browserpool/camoufox_server",from = "../../bases"},
]

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
pydantic-settings = "^2.15.0"
dishka = "^1.10.1"
camoufox = {extras = ["geoip"], version = "^0.5.6"}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
run_server = "browserpool.camoufox_server:run"
