[tool.poetry]
name = "service"
version = "0.1.0"

authors = ["ycalk (Лосев Алексей) <alosev752@gmail.com>"]
license = ""

packages = [
    {include = "browserpool/migrator",from = "../../bases"},
    {include = "browserpool/entrypoint",from = "../../bases"},
    {include = "browserpool/service",from = "../../components"},
    {include = "browserpool/variant",from = "../../components"},
    {include = "browserpool/database",from = "../../components"},
    {include = "browserpool/container_driver",from = "../../components"},
    {include = "browserpool/domain_core",from = "../../components"},
    {include = "browserpool/logging",from = "../../components"},
]

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
fastapi = {extras = ["standart"], version = "^0.146.0"}
dishka = {extras = ["fastapi"], version = "^1.10.1"}
pydantic-settings = "^2.16.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.1.5"}
aiosqlite = "^0.22.1"
structlog = "^26.1.0"
opentelemetry-api = "^1.45.1"
opentelemetry-sdk = "^1.45.1"
opentelemetry-exporter-otlp = "^1.45.1"
opentelemetry-instrumentation-fastapi = "^0.66b1"
opentelemetry-instrumentation-httpx = "^0.66b1"
opentelemetry-instrumentation-sqlalchemy = "^0.66b1"
httpx = "^0.28.1"
alembic = "^1.20.0"
uvicorn = "^0.54.0"
websockets = "^17.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
alembic = "browserpool.migrator:run"
entrypoint = "browserpool.entrypoint:run"
worker = "browserpool.entrypoint:run_worker"