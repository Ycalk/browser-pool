worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    client_max_body_size 0;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # Public per browser hostnames: <20 hex container id>.vnc.<domain> serves the
    # KasmVNC UI straight from the browser container, <20 hex>.dev.<domain> serves
    # the development protocol through the API proxy.
    #
    # The id is resolved by a localhost only API subrequest (auth_request). The
    # resolver answers 2xx with X-Browser-* headers on a hit and 403 on a miss,
    # because nginx forwards only 401/403 from an auth subrequest; 403 is mapped
    # back to the public 404 below. X-Forwarded-For must stay empty, otherwise
    # uvicorn replaces the peer address with the original client and the
    # localhost_only guard rejects the subrequest.

    server {
        listen 8080;
        server_name '~^(?<browser_alias>[0-9a-f]{20})\.vnc\..+$';

        error_page 403 =404 @browser_not_found;

        location = /_resolve_browser {
            internal;
            proxy_pass http://127.0.0.1:8000/api/v1/internal/browsers/$browser_alias;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Forwarded-For "";
        }

        location / {
            auth_request /_resolve_browser;
            auth_request_set $browser_vnc_upstream $upstream_http_x_browser_vnc_upstream;

            # Covers the KasmVNC UI, its assets and /websockify. The websocket is
            # proxied straight to the container: KasmVNC rejects a handshake whose
            # Origin host does not match the Host header, and forwarding both as
            # the public hostname keeps them consistent.
            proxy_pass http://$browser_vnc_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location @browser_not_found {
            return 404;
        }
    }

    server {
        listen 8080;
        server_name '~^(?<browser_alias>[0-9a-f]{20})\.dev\..+$';

        error_page 403 =404 @browser_not_found;

        location = /_resolve_browser {
            internal;
            proxy_pass http://127.0.0.1:8000/api/v1/internal/browsers/$browser_alias;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Forwarded-For "";
        }

        location / {
            auth_request /_resolve_browser;
            auth_request_set $browser_id $upstream_http_x_browser_id;

            proxy_pass http://127.0.0.1:8000/api/v1/browsers/$browser_id/proxy$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location @browser_not_found {
            return 404;
        }
    }
}
